<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Election Voting Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f0f2f5; padding: 16px; max-width: 700px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 8px; font-size: 24px; }
    .progress { text-align: center; color: #666; margin-bottom: 20px; font-size: 15px; }
    
    .candidate {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      cursor: pointer;
      border-left: 10px solid #ccc;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .candidate:active { transform: scale(0.98); }
    .candidate img {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      object-fit: cover;
      background: #ddd;
      flex-shrink: 0;
    }
    .candidate-info { flex: 1; }
    .candidate-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .party-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: white;
      margin-bottom: 8px;
    }
    .bio { font-size: 14px; color: #444; }

    .results-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }
    .party-count {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-size: 16px;
    }
    button {
      background: #0070f3;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
      margin-top: 16px;
    }
    .restart { background: #ff3b30; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const elections = [
      {
        title: "President of the United States",
        candidates: [
          {
            name: "John Smith",
            party: "Democrat",
            color: "#1a73e8",
            image: "https://i.pravatar.cc/150?img=11",
            bio: "Former governor. Focused on healthcare and climate. 20 years in public service."
          },
          {
            name: "Michael Johnson",
            party: "Republican",
            color: "#e74c3c",
            image: "https://i.pravatar.cc/150?img=12",
            bio: "Business leader and senator. Strong on economy and border security."
          },
          {
            name: "Sarah Williams",
            party: "Independent",
            color: "#9b59b6",
            image: "https://i.pravatar.cc/150?img=5",
            bio: "Tech entrepreneur turned politician. Focused on innovation and education."
          }
        ]
      },
      {
        title: "U.S. Senate",
        candidates: [
          {
            name: "David Lee",
            party: "Democrat",
            color: "#1a73e8",
            image: "https://i.pravatar.cc/150?img=13",
            bio: "Current congressman. Advocates for workers' rights and green energy."
          },
          {
            name: "Robert Brown",
            party: "Republican",
            color: "#e74c3c",
            image: "https://i.pravatar.cc/150?img=14",
            bio: "Military veteran and small business owner. Strong national defense stance."
          }
        ]
      },
      {
        title: "Governor",
        candidates: [
          {
            name: "Emily Davis",
            party: "Democrat",
            color: "#1a73e8",
            image: "https://i.pravatar.cc/150?img=9",
            bio: "State attorney general. Tough on crime and education reformer."
          },
          {
            name: "James Wilson",
            party: "Republican",
            color: "#e74c3c",
            image: "https://i.pravatar.cc/150?img=15",
            bio: "Former mayor. Focused on tax cuts and infrastructure."
          },
          {
            name: "Thomas Clark",
            party: "Whig",
            color: "#f39c12",
            image: "https://i.pravatar.cc/150?img=16",
            bio: "Modern Whig candidate. Emphasizes moderate policies and unity."
          }
        ]
      },
      {
        title: "House of Representatives",
        candidates: [
          {
            name: "Lisa Martinez",
            party: "Democrat",
            color: "#1a73e8",
            image: "https://i.pravatar.cc/150?img=10",
            bio: "Community organizer. Focused on housing and healthcare access."
          },
          {
            name: "Kevin Thompson",
            party: "Republican",
            color: "#e74c3c",
            image: "https://i.pravatar.cc/150?img=17",
            bio: "Local business owner. Promises to cut regulations and support small business."
          }
        ]
      }
    ];

    let current = 0;
    let votes = [];

    function render() {
      const app = document.getElementById("app");

      // Final Results
      if (current >= elections.length) {
        const partyCount = {};
        votes.forEach(function(v) {
          partyCount[v.party] = (partyCount[v.party] || 0) + 1;
        });

        let html = "<h1>Your Final Ballot</h1>";
        html += '<div class="results-card"><h2 style="margin-bottom:12px">Candidates You Voted For</h2>';

        votes.forEach(function(v, i) {
          html += '<div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #eee">';
          html += "<strong>" + elections[i].title + "</strong><br>";
          html += '<span style="color:' + v.color + ';font-weight:700">' + v.name + "</span> (" + v.party + ")";
          html += "</div>";
        });

        html += "</div>";
        html += '<div class="results-card"><h2 style="margin-bottom:12px">Party Totals</h2>';

        for (let party in partyCount) {
          html += '<div class="party-count">';
          html += "<span>" + party + "</span>";
          html += "<strong>" + partyCount[party] + (partyCount[party] > 1 ? " times" : " time") + "</strong>";
          html += "</div>";
        }

        html += "</div>";
        html += '<button class="restart" onclick="restart()">Start Over</button>';
        app.innerHTML = html;
        return;
      }

      // Voting Screen
      const election = elections[current];
      let html = "<h1>" + election.title + "</h1>";
      html += '<div class="progress">Election ' + (current + 1) + ' of ' + elections.length + "</div>";

      election.candidates.forEach(function(c, index) {
        html += '<div class="candidate" style="border-left-color:' + c.color + '" onclick="vote(' + index + ')">';
        html += '<img src="' + c.image + '" alt="' + c.name + '">';
        html += '<div class="candidate-info">';
        html += '<div class="candidate-name">' + c.name + "</div>";
        html += '<div class="party-tag" style="background:' + c.color + '">' + c.party + "</div>";
        html += '<div class="bio">' + c.bio + "</div>";
        html += "</div></div>";
      });

      app.innerHTML = html;
    }

    function vote(index) {
      votes.push(elections[current].candidates[index]);
      current++;
      render();
      window.scrollTo(0, 0);
    }

    function restart() {
      current = 0;
      votes = [];
      render();
    }

    render();
  </script>
</body>
</html>
