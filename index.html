<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Election Voting Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f0f2f5; padding: 16px; max-width: 700px; margin: 0 auto; line-height: 1.5; }
    h1, h2 { text-align: center; margin-bottom: 16px; }
    .progress { text-align: center; color: #555; margin-bottom: 20px; font-size: 15px; }
    
    .candidate {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      border-left: 10px solid #ccc;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .candidate:active { transform: scale(0.98); }
    .candidate img {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      object-fit: cover;
      background: #ddd;
      flex-shrink: 0;
    }
    .candidate-info { flex: 1; }
    .candidate-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .party-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: white;
      margin-bottom: 8px;
    }
    .bio { font-size: 14px; color: #444; }

    .results-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }
    .party-count {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 16px;
    }
    .party-count:last-child { border-bottom: none; }
    
    button {
      background: #0070f3;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
      margin-top: 20px;
      cursor: pointer;
    }
    .restart { background: #ff3b30; }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    // ========== EDIT THIS SECTION ==========
    const elections = [
      {
        title: "President of the United States",
        candidates: [
          {
            name: "John Smith",
            party: "Democrat",
            color: "#1a73e8",
            image: "https://i.pravatar.cc/150?img=11",
            bio: "Former governor. Focused on healthcare and climate. 20 years in public service."
          },
          {
            name: "Michael Johnson",
            party: "Republican",
            color: "#e74c3c",
            image: "https://i.pravatar.cc/150?img=12",
            bio: "Business leader and senator. Strong on economy and border security."
          },
          {
            name: "Sarah Williams",
            party: "Independent",
            color: "#9b59b6",
            image: "https://i.pravatar.cc/150?img=5",
            bio: "Tech entrepreneur turned politician. Focused on innovation and education."
          }
        ]
      },
      {
        title: "U.S. Senate",
        candidates: [
          {
            name: "David Lee",
            party: "Democrat",
            color: "#1a73e8",
            image: "https://i.pravatar.cc/150?img=13",
            bio: "Current congressman. Advocates for workers' rights and green energy."
          },
          {
            name: "Robert Brown",
            party: "Republican",
            color: "#e74c3c",
            image: "https://i.pravatar.cc/150?img=14",
            bio: "Military veteran and small business owner. Strong national defense stance."
          }
        ]
      },
      {
        title: "Governor",
        candidates: [
          {
            name: "Emily Davis",
            party: "Democrat",
            color: "#1a73e8",
            image: "https://i.pravatar.cc/150?img=9",
            bio: "State attorney general. Tough on crime and education reformer."
          },
          {
            name: "James Wilson",
            party: "Republican",
            color: "#e74c3c",
            image: "https://i.pravatar.cc/150?img=15",
            bio: "Former mayor. Focused on tax cuts and infrastructure."
          },
          {
            name: "Thomas Clark",
            party: "Whig",
            color: "#f39c12",
            image: "https://i.pravatar.cc/150?img=16",
            bio: "Modern Whig candidate. Emphasizes moderate policies and unity."
          }
        ]
      },
      {
        title: "House of Representatives",
        candidates: [
          {
            name: "Lisa Martinez",
            party: "Democrat",
            color: "#1a73e8",
            image: "https://i.pravatar.cc/150?img=10",
            bio: "Community organizer. Focused on housing and healthcare access."
          },
          {
            name: "Kevin Thompson",
            party: "Republican",
            color: "#e74c3c",
            image: "https://i.pravatar.cc/150?img=17",
            bio: "Local business owner. Promises to cut regulations and support small business."
          }
        ]
      }
    ];
    // ========== END OF EDIT SECTION ==========

    let currentElection = 0;
    let votes = [];          // stores the candidate objects you chose
    let partyCount = {};     // tallies parties

    function render() {
      const app = document.getElementById('app');

      // FINAL RESULTS SCREEN
      if (currentElection >= elections.length) {
        // Count parties
        partyCount = {};
        votes.forEach(v => {
          partyCount[v.party] = (partyCount[v.party] || 0) + 1;
        });

        let html = `
          <h1>Your Final Ballot</h1>
          <div class="results-card">
            <h2>Candidates You Voted For</h2>
        `;

        votes.forEach((v, i) => {
          html += `
            <div style="margin: 12px 0; padding-bottom: 12px; border-bottom: 1px solid #eee;">
              <strong>${elections[i].title}</strong><br>
              <span style="color:\( {v.color}; font-weight:700;"> \){v.name}</span> (${v.party})
            </div>
          `;
        });

        html += `</div>
          <div class="results-card">
            <h2>Party Totals</h2>
        `;

        for (let party in partyCount) {
          html += `
            <div class="party-count">
              <span>${party}</span>
              <strong>\( {partyCount[party]} time \){partyCount[party] > 1 ? 's' : ''}</strong>
            </div>
          `;
        }

        html += `
          </div>
          <button class="restart" onclick="restart()">Start Over</button>
        `;

        app.innerHTML = html;
        return;
      }

      // VOTING SCREEN
      const election = elections[currentElection];

      let html = `
        <h1>${election.title}</h1>
        <div class="progress">Election ${currentElection + 1} of ${elections.length}</div>
      `;

      election.candidates.forEach((c, index) => {
        html += `
          <div class="candidate" style="border-left-color: \( {c.color}" onclick="vote( \){index})">
            <img src="\( {c.image}" alt=" \){c.name}">
            <div class="candidate-info">
              <div class="candidate-name">${c.name}</div>
              <div class="party-tag" style="background:\( {c.color}"> \){c.party}</div>
              <div class="bio">${c.bio}</div>
            </div>
          </div>
        `;
      });

      app.innerHTML = html;
    }

    function vote(index) {
      const chosen = elections[currentElection].candidates[index];
      votes.push(chosen);
      currentElection++;
      render();
      window.scrollTo(0, 0);
    }

    function restart() {
      currentElection = 0;
      votes = [];
      partyCount = {};
      render();
    }

    // Start the simulator
    render();
  </script>
</body>
</html>
